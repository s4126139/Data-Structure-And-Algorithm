<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
  <title id="title">Circular array queue physical and logical order</title>
  <desc id="desc">A five-cell array contains f, empty, c, d, e. Read points to cell two and write points to cell one, so the logical FIFO order is c, d, e, f.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.h{font:700 28px system-ui,sans-serif;fill:#0f172a}.t{font:600 21px system-ui,sans-serif;fill:#0f172a}.b{font:18px system-ui,sans-serif;fill:#334155}.m{font:22px ui-monospace,monospace;fill:#0f172a}.ar{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="530" fill="#f8fafc"/><text x="50" y="52" class="h">Circular queue: physical positions are not the FIFO order</text>
  <rect x="45" y="85" width="1110" height="390" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="75" y="130" class="t">Physical array (capacity 5, one slot deliberately unused)</text>
  <g transform="translate(175 195)"><g><rect x="0" y="0" width="150" height="80" fill="#fff" stroke="#334155" stroke-width="2"/><rect x="150" y="0" width="150" height="80" fill="#fff" stroke="#334155" stroke-width="2"/><rect x="300" y="0" width="150" height="80" fill="#fef3c7" stroke="#334155" stroke-width="2"/><rect x="450" y="0" width="150" height="80" fill="#fef3c7" stroke="#334155" stroke-width="2"/><rect x="600" y="0" width="150" height="80" fill="#fef3c7" stroke="#334155" stroke-width="2"/></g><g class="m" text-anchor="middle"><text x="75" y="49">f</text><text x="225" y="49">empty</text><text x="375" y="49">c</text><text x="525" y="49">d</text><text x="675" y="49">e</text></g><g class="b" text-anchor="middle"><text x="75" y="105">index 0</text><text x="225" y="105">index 1</text><text x="375" y="105">index 2</text><text x="525" y="105">index 3</text><text x="675" y="105">index 4</text></g><path class="ar" d="M375 -72 L375 -10"/><text x="330" y="-82" class="t">read = 2</text><path class="ar" d="M225 -72 L225 -10"/><text x="175" y="-82" class="t">write = 1</text></g>
  <text x="105" y="355" class="t">Logical FIFO order</text><g transform="translate(310 320)"><g><rect x="0" y="0" width="120" height="64" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="120" y="0" width="120" height="64" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="240" y="0" width="120" height="64" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="360" y="0" width="120" height="64" fill="#fff" stroke="#2563eb" stroke-width="2"/></g><g class="m" text-anchor="middle"><text x="60" y="41">c</text><text x="180" y="41">d</text><text x="300" y="41">e</text><text x="420" y="41">f</text></g><path class="ar" d="M-90 32 L-10 32"/><text x="-88" y="20" class="b">next out</text></g>
  <text x="105" y="430" class="b">Empty: read == write. Full: (write + 1) mod 5 == read. Therefore this five-cell design stores at most four items.</text>
</svg>
