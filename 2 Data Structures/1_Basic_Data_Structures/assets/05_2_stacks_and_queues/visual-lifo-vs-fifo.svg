<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">LIFO stack compared with FIFO queue</title>
  <desc id="desc">A stack inserts and removes at the same end, while a queue inserts at the back and removes from the front.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.h{font:700 28px system-ui,sans-serif;fill:#0f172a}.t{font:600 22px system-ui,sans-serif;fill:#0f172a}.b{font:18px system-ui,sans-serif;fill:#334155}.m{font:20px ui-monospace,monospace;fill:#0f172a}.ar{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="520" fill="#f8fafc"/><text x="50" y="52" class="h">Same items, different removal rule</text>
  <rect x="40" y="85" width="535" height="390" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="70" y="128" class="t">Stack — LIFO</text><text x="70" y="158" class="b">Last in, first out. Push and Pop use the same end.</text>
  <g transform="translate(220 205)"><rect x="0" y="180" width="180" height="62" fill="#fff" stroke="#334155" stroke-width="2"/><rect x="0" y="118" width="180" height="62" fill="#fff" stroke="#334155" stroke-width="2"/><rect x="0" y="56" width="180" height="62" fill="#fff" stroke="#334155" stroke-width="2"/><g class="m" text-anchor="middle"><text x="90" y="218">a (oldest)</text><text x="90" y="156">b</text><text x="90" y="94">c (top)</text></g><path class="ar" d="M90 15 L90 48"/><text x="125" y="28" class="b">Push / Pop</text></g>
  <rect x="625" y="85" width="535" height="390" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="655" y="128" class="t">Queue — FIFO</text><text x="655" y="158" class="b">First in, first out. Enqueue at back; Dequeue at front.</text>
  <g transform="translate(690 260)"><path class="ar" d="M0 35 L62 35"/><text x="0" y="20" class="b">Dequeue</text><g><rect x="70" y="0" width="120" height="70" fill="#fff" stroke="#334155" stroke-width="2"/><rect x="190" y="0" width="120" height="70" fill="#fff" stroke="#334155" stroke-width="2"/><rect x="310" y="0" width="120" height="70" fill="#fff" stroke="#334155" stroke-width="2"/></g><g class="m" text-anchor="middle"><text x="130" y="43">a</text><text x="250" y="43">b</text><text x="370" y="43">c</text></g><path class="ar" d="M520 35 L442 35"/><text x="444" y="20" class="b">Enqueue</text><text x="75" y="102" class="b">front / oldest</text><text x="312" y="102" class="b">back / newest</text></g>
</svg>
