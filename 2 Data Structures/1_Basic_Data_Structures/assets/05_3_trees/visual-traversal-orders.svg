<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc">
  <title id="title">Four traversal orders on one binary tree</title>
  <desc id="desc">The Les binary search tree and the resulting in-order, pre-order, post-order and breadth-first traversal sequences.</desc>
  <defs><style>.h{font:700 28px system-ui,sans-serif;fill:#0f172a}.t{font:600 20px system-ui,sans-serif;fill:#0f172a}.b{font:18px system-ui,sans-serif;fill:#334155}.m{font:18px ui-monospace,monospace;fill:#0f172a}.edge{stroke:#64748b;stroke-width:2}.node{fill:#fff;stroke:#2563eb;stroke-width:2}</style></defs>
  <rect width="1280" height="850" fill="#f8fafc"/><text x="45" y="50" class="h">One tree, four valid traversal orders</text>
  <rect x="40" y="80" width="1200" height="360" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <g stroke="#64748b" stroke-width="2"><line x1="640" y1="135" x2="430" y2="215"/><line x1="640" y1="135" x2="850" y2="215"/><line x1="430" y1="215" x2="315" y2="300"/><line x1="430" y1="215" x2="515" y2="300"/><line x1="850" y1="215" x2="765" y2="300"/><line x1="850" y1="215" x2="965" y2="300"/><line x1="965" y1="300" x2="900" y2="385"/><line x1="965" y1="300" x2="1030" y2="385"/></g>
  <g fill="#ffffff" stroke="#2563eb" stroke-width="2"><circle cx="640" cy="125" r="34"/><circle cx="430" cy="215" r="34"/><circle cx="850" cy="215" r="34"/><circle cx="315" cy="300" r="34"/><circle cx="515" cy="300" r="34"/><circle cx="765" cy="300" r="34"/><circle cx="965" cy="300" r="34"/><circle cx="900" cy="385" r="34"/><circle cx="1030" cy="385" r="34"/></g>
  <g class="t" text-anchor="middle"><text x="640" y="132">Les</text><text x="430" y="222">Cathy</text><text x="850" y="222">Sam</text><text x="315" y="307">Alex</text><text x="515" y="307">Frank</text><text x="765" y="307">Nancy</text><text x="965" y="307">Violet</text><text x="900" y="392">Tony</text><text x="1030" y="392">Wendy</text></g>
  <g transform="translate(55 475)"><text x="0" y="0" class="t">In-order</text><text x="175" y="0" class="b">left → node → right</text><text x="0" y="35" class="m">Alex, Cathy, Frank, Les, Nancy, Sam, Tony, Violet, Wendy</text><text x="0" y="92" class="t">Pre-order</text><text x="175" y="92" class="b">node → left → right</text><text x="0" y="127" class="m">Les, Cathy, Alex, Frank, Sam, Nancy, Violet, Tony, Wendy</text><text x="0" y="184" class="t">Post-order</text><text x="175" y="184" class="b">left → right → node</text><text x="0" y="219" class="m">Alex, Frank, Cathy, Nancy, Tony, Wendy, Violet, Sam, Les</text><text x="0" y="276" class="t">Breadth-first</text><text x="175" y="276" class="b">level by level, using a queue</text><text x="0" y="311" class="m">Les, Cathy, Sam, Alex, Frank, Nancy, Violet, Tony, Wendy</text></g>
</svg>
